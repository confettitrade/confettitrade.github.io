<!doctype html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="paper.css?v=v3tabs">
  <link rel="stylesheet" href="points.css?v=c3ee29a">
  <script>
    /* Apply a saved night theme before first paint so the page never flashes cream. */
    try {
      if (localStorage.getItem('confetti.theme') === 'night') {
        document.documentElement.setAttribute('data-theme', 'night');
      }
    } catch (e) { /* storage blocked: stay on paper */ }
  </script>
</head>
<body class="tabs-page" data-page="leaderboard">

  <header class="header container-fluid">
    <a class="wordmark" href="index.html">confetti<span class="cursor cursor-block" aria-hidden="true"></span></a>
    <nav class="nav nav-main" aria-label="Primary">
      <a href="trade.html">Trade</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="house.html">House</a>
      <a href="confetti.html">Confetti</a>
      <a href="leaderboard.html" aria-current="page">Leaderboard</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-sm btn-accent" id="connectBtn" type="button">Connect</button>
    </div>
  </header>

  <main class="container tab-main">
    <div class="tab-title"><h1>Leaderboard</h1><span class="sub" id="lbNote"></span></div>

    <div class="tab-grid">
      <section class="panel" aria-label="Points">
        <div class="panel-head"><span>Points</span><span class="count" id="lbPtsCount"></span></div>
        <div class="pos-lines" id="lbPoints">
          <div class="empty">Loading points…</div>
        </div>
      </section>

      <section class="panel" aria-label="Realised PnL">
        <div class="panel-head"><span>Realised PnL</span><span class="count" id="lbPnlCount"></span></div>
        <div class="pos-lines" id="lbPnl">
          <div class="empty">Scanning events…</div>
        </div>
      </section>
    </div>

    <footer class="trade-foot">
      <a class="wordmark" href="index.html">confetti<span class="cursor cursor-block" aria-hidden="true"></span></a>
      <span>HyperEVM (999)</span>
      <span class="spacer"></span>
      <a href="docs.html">docs</a>
      <a href="terms.html">terms</a>
      <a href="https://x.com/confetti_trade" target="_blank" rel="noopener">@confetti_trade</a>
      <a href="https://github.com/confettitrade" target="_blank" rel="noopener">github</a>
      <button class="btn btn-sm btn-ghost" id="themeToggle" type="button" aria-pressed="false">Night</button>
    </footer>
  </main>

  <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js" integrity="sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="tabs.js?v=v3pins" defer></script>
  <script src="points.js?v=c3ee29a" defer></script>
</body>
</html>
